<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тихие пейзажи</title>
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --text: #2e2b28;
    --muted: #7a736b;
    --shadow: 0 6px 24px rgba(40, 30, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --card: #202226;
      --text: #e8e4de;
      --muted: #9a958e;
      --shadow: 0 6px 24px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --card: #202226;
    --text: #e8e4de;
    --muted: #9a958e;
    --shadow: 0 6px 24px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 16px 64px;
  }
  h1 {
    font-weight: normal;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 8px;
    text-align: center;
  }
  .lead {
    text-align: center;
    color: var(--muted);
    margin: 0 0 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
    gap: 28px;
  }
  figure {
    margin: 0;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  svg { display: block; width: 100%; height: auto; }
  figcaption { padding: 16px 20px 20px; }
  figcaption b { display: block; font-weight: normal; font-size: 19px; }
  figcaption span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Тихие пейзажи</h1>
  <p class="lead">Четыре места, где никто не позвонит</p>

  <div class="grid">

    <!-- 1. Туманные горы и озеро -->
    <figure>
      <svg viewBox="0 0 400 260" role="img" aria-label="Горы в тумане над озером на рассвете">
        <defs>
          <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6d9c4"/>
            <stop offset="1" stop-color="#fbeee2"/>
          </linearGradient>
          <linearGradient id="lake1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c9d3d6"/>
            <stop offset="1" stop-color="#9fb1b8"/>
          </linearGradient>
        </defs>
        <rect width="400" height="260" fill="url(#sky1)"/>
        <circle cx="290" cy="95" r="26" fill="#fff4e8" opacity=".9"/>
        <path d="M0 160 L70 90 L120 130 L190 60 L260 135 L320 95 L400 150 V180 H0Z" fill="#c8bfc4"/>
        <path d="M0 175 L60 130 L130 165 L200 115 L280 170 L350 135 L400 165 V185 H0Z" fill="#a69aa6"/>
        <rect y="150" width="400" height="20" fill="#fbeee2" opacity=".55"/>
        <path d="M0 182 L40 165 L100 180 L170 158 L240 182 L310 162 L400 180 V190 H0Z" fill="#6f6a7a"/>
        <rect y="188" width="400" height="72" fill="url(#lake1)"/>
        <ellipse cx="290" cy="205" rx="22" ry="3" fill="#fff4e8" opacity=".6"/>
        <ellipse cx="290" cy="215" rx="14" ry="2" fill="#fff4e8" opacity=".4"/>
        <path d="M140 226 h40 l-6 7 h-28z" fill="#4c4855"/>
        <line x1="160" y1="226" x2="160" y2="204" stroke="#4c4855" stroke-width="1.5"/>
        <path d="M161 205 l12 18 h-12z" fill="#e9e1da"/>
      </svg>
      <figcaption>
        <b>Озеро на рассвете</b>
        <span>Туман, лодка и ни одного уведомления.</span>
      </figcaption>
    </figure>

    <!-- 2. Хижина в зимнем лесу -->
    <figure>
      <svg viewBox="0 0 400 260" role="img" aria-label="Хижина со светящимся окном в зимнем лесу ночью">
        <defs>
          <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1c2541"/>
            <stop offset="1" stop-color="#3a506b"/>
          </linearGradient>
          <radialGradient id="glow2">
            <stop offset="0" stop-color="#ffd27a" stop-opacity=".7"/>
            <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="400" height="260" fill="url(#sky2)"/>
        <circle cx="70" cy="55" r="16" fill="#f1efe6"/>
        <circle cx="76" cy="50" r="14" fill="#1f2946"/>
        <g fill="#fff" opacity=".8">
          <circle cx="150" cy="30" r="1.2"/><circle cx="220" cy="55" r="1"/>
          <circle cx="310" cy="25" r="1.4"/><circle cx="360" cy="70" r="1"/>
          <circle cx="260" cy="90" r="1"/><circle cx="120" cy="85" r="1"/>
        </g>
        <path d="M0 200 Q100 175 200 195 T400 190 V260 H0Z" fill="#e3e9f0"/>
        <g fill="#20304a">
          <path d="M30 205 l20 -70 l20 70z"/><path d="M60 200 l16 -55 l16 55z"/>
          <path d="M320 198 l22 -80 l22 80z"/><path d="M355 200 l16 -55 l16 55z"/>
          <path d="M290 200 l14 -45 l14 45z"/>
        </g>
        <circle cx="200" cy="185" r="60" fill="url(#glow2)"/>
        <rect x="165" y="165" width="70" height="40" fill="#5a3e36"/>
        <path d="M155 168 L200 135 L245 168Z" fill="#f4f6f8"/>
        <rect x="215" y="140" width="8" height="18" fill="#5a3e36"/>
        <rect x="180" y="175" width="16" height="14" fill="#ffd27a"/>
        <rect x="206" y="180" width="14" height="25" fill="#3b2924"/>
        <path d="M219 135 q-6 -10 2 -18 q8 -8 0 -16" stroke="#c9d1dc" stroke-width="3" fill="none" opacity=".5"/>
      </svg>
      <figcaption>
        <b>Хижина в снегу</b>
        <span>Тёплый свет в окне, чай и книга.</span>
      </figcaption>
    </figure>

    <!-- 3. Маяк на закате -->
    <figure>
      <svg viewBox="0 0 400 260" role="img" aria-label="Одинокий маяк на скале у моря на закате">
        <defs>
          <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5b5f97"/>
            <stop offset=".6" stop-color="#e59a8c"/>
            <stop offset="1" stop-color="#f7c59f"/>
          </linearGradient>
          <linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6a7fa8"/>
            <stop offset="1" stop-color="#2f3f63"/>
          </linearGradient>
        </defs>
        <rect width="400" height="260" fill="url(#sky3)"/>
        <circle cx="120" cy="170" r="30" fill="#ffe1b5"/>
        <rect y="170" width="400" height="90" fill="url(#sea3)"/>
        <g stroke="#ffe1b5" stroke-linecap="round" opacity=".6">
          <line x1="95" y1="182" x2="145" y2="182" stroke-width="3"/>
          <line x1="105" y1="194" x2="135" y2="194" stroke-width="2"/>
          <line x1="112" y1="206" x2="128" y2="206" stroke-width="2"/>
        </g>
        <path d="M250 260 L270 190 Q300 175 340 185 L380 200 L400 260Z" fill="#2a2a3a"/>
        <path d="M300 185 L306 105 H326 L332 185Z" fill="#f2ede6"/>
        <rect x="305" y="125" width="22" height="10" fill="#c0504d"/>
        <rect x="303" y="155" width="26" height="10" fill="#c0504d"/>
        <rect x="302" y="95" width="28" height="12" fill="#3a3a4a"/>
        <rect x="309" y="85" width="14" height="10" fill="#ffe9a8"/>
        <path d="M307 85 L316 74 L325 85Z" fill="#3a3a4a"/>
        <path d="M309 90 L200 60 L200 110Z" fill="#ffe9a8" opacity=".25"/>
        <path d="M200 60 q8 -4 16 0 M220 45 q6 -3 12 0" stroke="#3a3a4a" stroke-width="1.5" fill="none"/>
      </svg>
      <figcaption>
        <b>Маяк у моря</b>
        <span>Светит всем, но говорить ни с кем не обязан.</span>
      </figcaption>
    </figure>

    <!-- 4. Дерево под звёздами -->
    <figure>
      <svg viewBox="0 0 400 260" role="img" aria-label="Одинокое дерево на холме под звёздным небом">
        <defs>
          <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0f1b2d"/>
            <stop offset="1" stop-color="#2d4a5a"/>
          </linearGradient>
        </defs>
        <rect width="400" height="260" fill="url(#sky4)"/>
        <path d="M-20 120 Q120 60 220 90 T420 70" stroke="#b9c8e8" stroke-width="40" fill="none" opacity=".08"/>
        <g fill="#fff">
          <circle cx="40" cy="40" r="1.3"/><circle cx="90" cy="80" r="1"/>
          <circle cx="140" cy="30" r="1.6"/><circle cx="190" cy="60" r="1"/>
          <circle cx="230" cy="25" r="1.2"/><circle cx="270" cy="75" r="1.5"/>
          <circle cx="320" cy="40" r="1"/><circle cx="360" cy="90" r="1.3"/>
          <circle cx="380" cy="30" r="1"/><circle cx="60" cy="120" r="1"/>
          <circle cx="170" cy="110" r="1.1"/><circle cx="300" cy="120" r="1"/>
        </g>
        <path d="M0 230 Q140 170 260 195 T400 200 V260 H0Z" fill="#1c3340"/>
        <path d="M0 245 Q120 225 220 238 T400 235 V260 H0Z" fill="#132530"/>
        <path d="M234 198 L237 135" stroke="#0d1a22" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g fill="#0d1a22">
          <circle cx="236" cy="128" r="26"/><circle cx="214" cy="138" r="18"/>
          <circle cx="260" cy="140" r="18"/><circle cx="240" cy="108" r="18"/>
        </g>
        <circle cx="252" cy="198" r="3" fill="#0d1a22"/>
        <path d="M249 201 h6 l1 10 h-8z" fill="#0d1a22"/>
      </svg>
      <figcaption>
        <b>Холм под звёздами</b>
        <span>Ты, дерево и тишина на всю ночь.</span>
      </figcaption>
    </figure>

  </div>
</main>
</body>
</html>
